name: Browser smoke tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Record environment
        run: |
          echo "Tested commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Runner: $RUNNER_OS; browser: Chromium" >> "$GITHUB_STEP_SUMMARY"
          echo 'Reproduce: pnpm install --frozen-lockfile && pnpm exec playwright install chromium && pnpm test:e2e' >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
