name: I13 native QA proof of concept
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  native-qa:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'infra/i13-native-qa')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: i13-qa-${{ github.event.pull_request.head.sha || github.sha }}
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node native-qa/check-driver-parser.mjs
      - run: node --test native-qa/report.test.mjs native-qa/config.test.mjs
      - name: Install official driver
        run: |
          cargo install tauri-driver --version 2.1.0 --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installed = (cargo install --list | Out-String)
          if ($LASTEXITCODE -ne 0 -or $installed -notmatch '(?m)^tauri-driver v2\.1\.0:') { throw 'Pinned tauri-driver installation not verified.' }
          rustc --version
          node --version
          pnpm exec wdio --version
          git rev-parse HEAD
      - name: Install matching Microsoft Edge WebDriver
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'native-qa-results' | Out-Null
          $paths = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $runtime = $null
          foreach ($entry in $paths) {
            $version = (Get-ItemProperty -LiteralPath $entry -Name pv -ErrorAction SilentlyContinue).pv
            if ($version -match '^\d+\.\d+\.\d+\.\d+$' -and $version -ne '0.0.0.0') { $runtime = $version; break }
          }
          if (-not $runtime) { throw 'WebView2 runtime version unavailable; refusing to launch.' }
          $driverDir = Join-Path $env:RUNNER_TEMP 'i13-microsoft-edgedriver'
          if (Test-Path -LiteralPath $driverDir) { throw 'Driver directory already exists.' }
          New-Item -ItemType Directory -Path $driverDir | Out-Null
          $archive = Join-Path $driverDir 'driver.zip'
          Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$runtime/edgedriver_win64.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $driverDir
          $driver = Join-Path $driverDir 'msedgedriver.exe'
          if (-not (Test-Path -LiteralPath $driver)) { throw 'Microsoft Edge WebDriver missing.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $driver
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Microsoft Edge WebDriver signature invalid.' }
          $driverVersion = (& $driver --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $driverVersion.Contains($runtime)) { throw 'WebDriver does not match WebView2 runtime.' }
          @("Tested commit: $(git rev-parse HEAD)", "Rust: $(rustc --version)", "Node: $(node --version)", "WebdriverIO: $(pnpm exec wdio --version)", 'tauri-driver: 2.1.0 (cargo install --list)', "WebView2 runtime: $runtime", $driverVersion) | Tee-Object -FilePath 'native-qa-results/environment.txt'
          $driverDir | Out-File -FilePath $env:GITHUB_PATH -Append
          "STRIDE_QA_DRIVER_VERSION=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Verify WebdriverIO driver discovery
        run: node native-qa/check-driver-parser.mjs --verify-discovery
      - name: Driver-only status check
        run: node native-qa/driver-smoke.mjs
      - run: pnpm verify
      - name: Verify production Rust configuration
        working-directory: src-tauri
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build isolated QA executable
        env:
          VITE_STRIDE_QA: "1"
        run: pnpm tauri build --no-bundle --features qa-isolated --config src-tauri/tauri.qa.conf.json
      - name: Prepare disposable profile and validate before launch
        shell: pwsh
        run: |
          $qaRoot = Join-Path $env:RUNNER_TEMP "stride-i13-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $qaRoot) { throw 'QA profile already exists' }
          New-Item -ItemType Directory -Path $qaRoot | Out-Null
          "STRIDE_QA_ROOT=$qaRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "STRIDE_QA_CONFIG_BASE=$([Environment]::GetFolderPath('ApplicationData'))" | Out-File -FilePath $env:GITHUB_ENV -Append
          "STRIDE_QA_LOCAL_BASE=$([Environment]::GetFolderPath('LocalApplicationData'))" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Fail-closed prelaunch isolation checks
        shell: pwsh
        run: |
          node native-qa/preflight.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $savedRoot = $env:STRIDE_QA_ROOT
          $env:STRIDE_QA_ROOT = ''
          node native-qa/preflight.mjs 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Missing QA root was accepted' }
          $env:STRIDE_QA_ROOT = $env:RUNNER_TEMP
          node native-qa/preflight.mjs 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Unsafe QA root was accepted' }
          $env:STRIDE_QA_ROOT = $savedRoot
          Write-Host "Negative isolation checks passed"
          exit 0
      - name: Native launch-only check
        env:
          STRIDE_QA_STAGE: launch
        run: |
          node native-qa/seed.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./native-qa/run-wdio.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Summarize native startup evidence
        if: always()
        run: node native-qa/report.mjs
      - name: Capture failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: i13-native-failure-${{ github.run_id }}
          path: native-qa-results/
          if-no-files-found: ignore
          retention-days: 7
