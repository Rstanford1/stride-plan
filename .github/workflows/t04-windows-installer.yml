name: T04 Windows acceptance installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build isolated T04 Windows installer
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out T04 branch
        uses: actions/checkout@v7
        with:
          ref: codex/t04-garmin-personal-api
          persist-credentials: false

      - name: Record source revision
        shell: pwsh
        run: git rev-parse HEAD

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Create isolated acceptance-test configuration
        shell: pwsh
        run: |
          $config = @{
            productName = "Stride Plan T04 Test"
            identifier = "com.strideplan.t04test"
            app = @{
              windows = @(
                @{
                  title = "Stride Plan T04 Test"
                  width = 1360
                  height = 860
                  minWidth = 680
                  minHeight = 680
                  resizable = $true
                }
              )
            }
            bundle = @{
              targets = @("nsis")
            }
          }

          $config |
            ConvertTo-Json -Depth 10 |
            Set-Content `
              -Path "src-tauri/tauri.t04test.conf.json" `
              -Encoding utf8

      - name: Isolate Windows Credential Manager target
        shell: pwsh
        run: |
          $path = "src-tauri/src/garmin_credentials.rs"
          $content = Get-Content $path -Raw

          $original = "com.strideplan.desktop/garmin-personal-api/v1"
          $isolated = "com.strideplan.t04test/garmin-personal-api/v1"

          if (
            -not $content.Contains($original) -or
            $content.IndexOf($original) -ne $content.LastIndexOf($original)
          ) {
            throw "Expected exactly one production credential target."
          }

          $content.Replace($original, $isolated) |
            Set-Content -Path $path -Encoding utf8

          Write-Host "Test credential identity configured."

      - name: Build Windows NSIS installer
        run: >
          pnpm tauri build
          --ci
          --bundles nsis
          --config src-tauri/tauri.t04test.conf.json

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installers = @(
            Get-ChildItem `
              "src-tauri/target/release/bundle/nsis" `
              -Filter "*.exe" -File
          )

          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer."
          }

          $installers | ForEach-Object {
            Write-Host "Installer: $($_.Name)"
            Get-FileHash $_.FullName -Algorithm SHA256
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: stride-plan-t04-windows-test
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
