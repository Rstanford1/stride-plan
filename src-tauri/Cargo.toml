[package]
name = "stride-plan"
version = "0.1.0"
description = "Local-first personal running plan"
authors = ["Stride Plan"]
edition = "2021"

[lib]
name = "stride_plan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
uuid = { version = "=1.29.1", features = ["v4"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls"] }
tokio = { version = "=1.54.1", features = ["sync", "time", "macros", "rt"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
base64 = "=0.22.1"
zeroize = "=1.9.1"
httpdate = "=1.0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Security_Credentials", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
